<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Say the Same</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { width: 100%; max-width: 500px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); text-align: center; position: relative; }
    
    h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 20px; }
    h2 { font-size: 1.25rem; margin-bottom: 15px; }
    p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 15px; line-height: 1.5; }
    
    .hidden { display: none !important; }
    .view-section { display: flex; flex-direction: column; gap: 15px; }

    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; outline: none; margin-bottom: 10px; }
    input:focus, select:focus { border-color: var(--primary); }

    .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; width: 100%; }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    .btn-outline:hover { background: #eff6ff; }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }

    .flex-row { display: flex; gap: 10px; }
    .flex-row .btn { flex: 1; }

    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; background: #e0e7ff; color: var(--primary); font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; }
    
    .card-grid { display: grid; gap: 10px; margin-bottom: 20px; }
    .word-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
    .word-card .player-name { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
    .word-card .word-text { font-size: 1.3rem; font-weight: bold; color: var(--text-main); }

    .history-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
    .history-table th, .history-table td { border: 1px solid var(--border); padding: 8px; text-align: center; }
    .history-table th { background: var(--bg); color: var(--text-muted); }

    /* Modal Overlay for Proposal */
    .modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); border-radius: var(--radius); display: flex; justify-content: center; align-items: center; z-index: 10; padding: 20px; }
    .modal-content { background: white; padding: 25px; border-radius: var(--radius); width: 100%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

<div class="container">
  <h1>Say the Same</h1>

  <!-- 1. 登入與首頁區塊 -->
  <div id="view-home" class="view-section">
    <p>小慕製作</p>
    <input type="text" id="playerName" placeholder="暱稱">
    <div style="border-top: 1px solid var(--border); margin: 10px 0;"></div>
    
    <label style="font-size: 0.85rem; color: var(--text-muted); text-align: left;">建立新房間</label>
    <div class="flex-row">
      <select id="maxPlayers" style="margin-bottom: 0;">
        <option value="2">2 人遊玩</option>
        <option value="3">3 人遊玩</option>
      </select>
      <button class="btn" onclick="createRoom()">建立房間</button>
    </div>
    
    <div style="margin: 10px 0; color: var(--text-muted);">或</div>
    
    <div class="flex-row">
      <input type="text" id="roomCodeInput" placeholder="輸入4位數房號" style="margin-bottom: 0; text-transform: uppercase;" maxlength="4">
      <button class="btn btn-outline" onclick="joinRoom()">加入房間</button>
    </div>
  </div>

  <!-- 2. 大廳等待區 -->
  <div id="view-lobby" class="view-section hidden">
    <h2>房號：<span id="lobbyRoomCode" style="color: var(--primary); letter-spacing: 2px;"></span></h2>
    <p>等待其他玩家加入... (<span id="lobbyCount"></span>)</p>
    <div id="lobbyPlayers" class="card-grid"></div>
  </div>

  <!-- 3. 遊玩輸入區 -->
  <div id="view-play" class="view-section hidden">
    <div class="badge">第 <span id="roundNumber">1</span> 輪</div>
    
    <!-- 上一輪結果提示區 -->
    <div id="prevRoundTip" class="hidden" style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 10px; margin-bottom: 15px; font-size: 0.85rem; color: #991b1b;">
      上一輪輸入：<span id="prevRoundWords" style="font-weight:bold;"></span>
    </div>

    <p>請輸入你想到的詞彙，所有人送出後將揭曉！</p>
    <input type="text" id="wordInput" placeholder="輸入詞彙...">
    <button id="btnSubmitWord" class="btn" onclick="submitWord()">送出詞彙</button>
    <p id="waitWordMsg" class="hidden" style="color: var(--primary); font-weight: bold; margin-top: 10px;">等待其他玩家送出...</p>
  </div>

  <!-- 4. 揭曉區 -->
  <div id="view-reveal" class="view-section hidden">
    <h2>本輪結果</h2>
    <div id="revealCards" class="card-grid"></div>
    <p id="revealStatusMsg" style="font-weight: bold; margin-bottom: 10px;"></p>
    
    <div class="flex-row">
      <button id="btnNextRound" class="btn" onclick="readyNextRound()">繼續下一輪</button>
      <button id="btnProposeMatch" class="btn btn-outline" onclick="proposeMatch()">我覺得意思差不多</button>
    </div>
    <p id="waitNextMsg" class="hidden" style="color: var(--primary); font-size: 0.85rem; margin-top: 10px;">等待其他人按確認...</p>
  </div>

  <!-- 5. 結束與歷史紀錄區 -->
  <div id="view-end" class="view-section hidden">
    <h2 style="color: var(--success);">🎉 達成共識！</h2>
    <p>輪數： <span id="endRoundCount"></span></p>
    
    <div style="max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px;">
      <table class="history-table" id="historyTable">
        <thead>
          <tr id="historyHeader"></tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>

    <button id="btnPlayAgain" class="btn" style="margin-top: 15px;" onclick="readyPlayAgain()">再玩一次</button>
    <p id="waitAgainMsg" class="hidden" style="color: var(--primary); font-size: 0.85rem; margin-top: 5px;">等待其他人按確認...</p>
  </div>

  <!-- 覆蓋彈窗：同意意思差不多 -->
  <div id="modal-proposal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 style="margin-bottom: 10px;">有人覺得意思差不多</h3>
      <p><strong id="proposerName">某人</strong> 認為這輪的詞彙意思相近，算過關。你同意嗎？</p>
      <div class="flex-row" style="margin-top: 20px;">
        <button class="btn btn-success" onclick="voteProposal(true)">同意過關</button>
        <button class="btn btn-danger" onclick="voteProposal(false)">不同意</button>
      </div>
    </div>
  </div>

</div>

<!-- Firebase Modular SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

  // 您的 Firebase 設定 (已加入 databaseURL)
  const firebaseConfig = {
    apiKey: "AIzaSyCfiDrOXQwSYSUuy6z193wn6QaeQ9iVgoI",
    authDomain: "say-the-same.firebaseapp.com",
    projectId: "say-the-same",
    storageBucket: "say-the-same.firebasestorage.app",
    messagingSenderId: "470512859955",
    appId: "1:470512859955:web:4c15bf08e4c6d62f229c46",
    measurementId: "G-Q9LGX9EDC4",
    databaseURL: "https://say-the-same-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  let myUid = null;
  let myName = "";
  let currentRoomId = null;
  let roomRef = null;
  let isHost = false; // 用於指派房主執行狀態切換（避免重複寫入資料庫）

  // 匿名登入
  signInAnonymously(auth).catch(error => console.error("Auth error:", error));
  onAuthStateChanged(auth, user => {
    if (user) myUid = user.uid;
  });

  // UI 切換邏輯
  function switchView(viewId) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
    document.getElementById(viewId).classList.remove('hidden');
  }

  // 1. 建立房間
  window.createRoom = async function() {
    myName = document.getElementById('playerName').value.trim() || "匿名玩家";
    if (!myUid) return alert("系統連線中，請稍候...");
    
    // 產生隨機4位數房號
    currentRoomId = Math.floor(1000 + Math.random() * 9000).toString();
    const maxP = parseInt(document.getElementById('maxPlayers').value);
    
    roomRef = ref(db, `rooms/${currentRoomId}`);
    await set(roomRef, {
      status: 'waiting',
      maxPlayers: maxP,
      round: 1,
      players: { [myUid]: myName }
    });
    
    listenToRoom();
  };

  // 2. 加入房間
  window.joinRoom = async function() {
    myName = document.getElementById('playerName').value.trim() || "匿名玩家";
    const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
    if (!code || !myUid) return alert("請確認房號與連線狀態");

    const snap = await get(ref(db, `rooms/${code}`));
    if (!snap.exists()) return alert("找不到該房間！");
    
    const room = snap.val();
    if (room.status !== 'waiting') return alert("遊戲已開始或已結束！");
    if (Object.keys(room.players || {}).length >= room.maxPlayers) return alert("房間已滿！");

    currentRoomId = code;
    roomRef = ref(db, `rooms/${currentRoomId}`);
    
    // 加入玩家清單
    await update(ref(db, `rooms/${currentRoomId}/players`), { [myUid]: myName });
    listenToRoom();
  };

  // 核心：監聽房間狀態變更
  function listenToRoom() {
    onValue(roomRef, (snapshot) => {
      const room = snapshot.val();
      if (!room) {
        alert("房間已關閉或不存在");
        location.reload();
        return;
      }
      
      const pIds = Object.keys(room.players || {}).sort();
      isHost = (pIds[0] === myUid); // 由清單中第一位玩家負責推進流程，避免資料庫衝突
      
      updateUI(room);
      handleHostLogic(room, pIds);
    });
  }

  // 更新畫面
  function updateUI(room) {
    const pKeys = Object.keys(room.players || {});
    
    // 狀態：等待中
    if (room.status === 'waiting') {
      switchView('view-lobby');
      document.getElementById('lobbyRoomCode').textContent = currentRoomId;
      document.getElementById('lobbyCount').textContent = `${pKeys.length}/${room.maxPlayers}`;
      
      let html = '';
      pKeys.forEach(uid => {
        html += `<div class="word-card"><div class="word-text">${room.players[uid]}</div></div>`;
      });
      document.getElementById('lobbyPlayers').innerHTML = html;
    }

    // 狀態：遊玩中 (輸入詞彙)
    if (room.status === 'playing') {
      switchView('view-play');
      document.getElementById('roundNumber').textContent = room.round;
      
      // 顯示上一輪的結果 (如果有)
      if (room.round > 1 && room.history && room.history[room.round - 1]) {
        const prevWords = Object.values(room.history[room.round - 1]).join('、');
        document.getElementById('prevRoundWords').textContent = prevWords;
        document.getElementById('prevRoundTip').classList.remove('hidden');
      } else {
        document.getElementById('prevRoundTip').classList.add('hidden');
      }

      // 重設按鈕與輸入框
      if (room.inputs && room.inputs[myUid]) {
        document.getElementById('btnSubmitWord').disabled = true;
        document.getElementById('waitWordMsg').classList.remove('hidden');
      } else {
        document.getElementById('btnSubmitWord').disabled = false;
        document.getElementById('wordInput').value = '';
        document.getElementById('waitWordMsg').classList.add('hidden');
      }
    }

    // 狀態：揭曉
    if (room.status === 'revealed') {
      switchView('view-reveal');
      
      let cardsHtml = '';
      pKeys.forEach(uid => {
        const word = (room.history && room.history[room.round]) ? room.history[room.round][uid] : '???';
        cardsHtml += `<div class="word-card">
                        <div class="player-name">${room.players[uid]}</div>
                        <div class="word-text">${word}</div>
                      </div>`;
      });
      document.getElementById('revealCards').innerHTML = cardsHtml;

      // 檢查是否完全一樣
      const words = Object.values(room.history[room.round] || {}).map(w => w.trim().toLowerCase());
      const allMatch = words.every(w => w === words[0]);
      
      if (allMatch) {
        document.getElementById('revealStatusMsg').textContent = "👏 完全一致！";
        document.getElementById('revealStatusMsg').style.color = "var(--success)";
        document.getElementById('btnNextRound').classList.add('hidden');
        document.getElementById('btnProposeMatch').classList.add('hidden');
      } else {
        document.getElementById('revealStatusMsg').textContent = "🤔 有什麼關聯性呢...";
        document.getElementById('revealStatusMsg').style.color = "var(--danger)";
        document.getElementById('btnNextRound').classList.remove('hidden');
        document.getElementById('btnProposeMatch').classList.remove('hidden');
      }

      // 如果已經按了準備下一輪
      if (room.nextReady && room.nextReady[myUid]) {
        document.getElementById('btnNextRound').disabled = true;
        document.getElementById('btnProposeMatch').disabled = true;
        document.getElementById('waitNextMsg').classList.remove('hidden');
      } else {
        document.getElementById('btnNextRound').disabled = false;
        document.getElementById('btnProposeMatch').disabled = false;
        document.getElementById('waitNextMsg').classList.add('hidden');
      }

      // 處理提議 (Propose) 彈窗
      const modal = document.getElementById('modal-proposal');
      if (room.proposal && room.proposal.status === 'pending' && !room.proposal.votes[myUid]) {
        document.getElementById('proposerName').textContent = room.players[room.proposal.proposer];
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    // 狀態：遊戲結束
    if (room.status === 'ended') {
      switchView('view-end');
      document.getElementById('endRoundCount').textContent = room.round;
      
      // 繪製歷史紀錄表
      const thead = document.getElementById('historyHeader');
      const tbody = document.getElementById('historyBody');
      thead.innerHTML = '<th>回合</th>';
      pKeys.forEach(uid => thead.innerHTML += `<th>${room.players[uid]}</th>`);
      
      tbody.innerHTML = '';
      for (let r = 1; r <= room.round; r++) {
        if (!room.history[r]) continue;
        let row = `<tr><td>${r}</td>`;
        pKeys.forEach(uid => {
          row += `<td>${room.history[r][uid] || '-'}</td>`;
        });
        row += `</tr>`;
        tbody.innerHTML += row;
      }

      if (room.playAgain && room.playAgain[myUid]) {
        document.getElementById('btnPlayAgain').disabled = true;
        document.getElementById('waitAgainMsg').classList.remove('hidden');
      } else {
        document.getElementById('btnPlayAgain').disabled = false;
        document.getElementById('waitAgainMsg').classList.add('hidden');
      }
    }
  }

  // 主機(Host)負責判定與推動遊戲進度
  async function handleHostLogic(room, pKeys) {
    if (!isHost) return;
    const maxP = room.maxPlayers;

    // 1. 等待中 -> 人滿自動開局
    if (room.status === 'waiting' && pKeys.length === maxP) {
      await update(roomRef, { status: 'playing' });
    }

    // 2. 遊玩中 -> 所有人輸入完畢，自動轉移至揭曉
    if (room.status === 'playing' && room.inputs && Object.keys(room.inputs).length === maxP) {
      const inputsObj = Object.assign({}, room.inputs);
      await update(roomRef, { 
        [`history/${room.round}`]: inputsObj,
        status: 'revealed',
        inputs: null // 清空輸入
      });
    }

    // 3. 揭曉中判定
    if (room.status === 'revealed') {
      // 檢查是否完全一樣，若一樣則 2 秒後自動進入結束畫面
      const words = Object.values(room.history[room.round] || {}).map(w => w.trim().toLowerCase());
      if (words.every(w => w === words[0]) && words.length === maxP) {
        setTimeout(() => {
          update(roomRef, { status: 'ended' });
        }, 2000);
        return; // 終止後續判斷
      }

      // 檢查提議機制
      if (room.proposal) {
        if (room.proposal.status === 'rejected') {
          // 有人拒絕，清空提議
          await update(roomRef, { proposal: null });
        } else if (room.proposal.status === 'pending' && Object.keys(room.proposal.votes || {}).length === maxP) {
          // 所有人同意
          await update(roomRef, { status: 'ended', proposal: null });
        }
      }

      // 檢查進入下一輪
      if (room.nextReady && Object.keys(room.nextReady).length === maxP && (!room.proposal || room.proposal.status !== 'pending')) {
        await update(roomRef, {
          round: room.round + 1,
          status: 'playing',
          nextReady: null
        });
      }
    }

    // 4. 遊戲結束 -> 重新開始
    if (room.status === 'ended' && room.playAgain && Object.keys(room.playAgain).length === maxP) {
      await update(roomRef, {
        status: 'playing',
        round: 1,
        history: null,
        playAgain: null,
        nextReady: null
      });
    }
  }

  // 玩家動作：送出詞彙
  window.submitWord = function() {
    const word = document.getElementById('wordInput').value.trim();
    if (!word) return alert("請輸入詞彙！");
    update(ref(db, `rooms/${currentRoomId}/inputs`), { [myUid]: word });
  };

  // 玩家動作：準備下一輪
  window.readyNextRound = function() {
    update(ref(db, `rooms/${currentRoomId}/nextReady`), { [myUid]: true });
  };

  // 玩家動作：提出意思相近
  window.proposeMatch = function() {
    update(ref(db, `rooms/${currentRoomId}/proposal`), {
      proposer: myUid,
      status: 'pending',
      votes: { [myUid]: true }
    });
  };

  // 玩家動作：投票是否同意意思相近
  window.voteProposal = function(isAgree) {
    if (isAgree) {
      update(ref(db, `rooms/${currentRoomId}/proposal/votes`), { [myUid]: true });
    } else {
      update(ref(db, `rooms/${currentRoomId}/proposal`), { status: 'rejected' });
    }
  };

  // 玩家動作：再玩一次
  window.readyPlayAgain = function() {
    update(ref(db, `rooms/${currentRoomId}/playAgain`), { [myUid]: true });
  };

</script>

</body>
</html>
